/* ---------------------------------------------------------------
   Connexion Supabase (API REST directe)
--------------------------------------------------------------- */

const SUPABASE_URL = "https://hhjgnzyzvcwsuwmhnsiv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YcVccuCkE6BfCkTatuZ3BA_qewNf_Ix";

async function supaFetch(path, { method = "GET", body, token, extraHeaders = {} } = {}) {
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${token || SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      Prefer: "return=representation",
      ...extraHeaders,
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const texte = await res.text();
  const data = texte ? JSON.parse(texte) : null;
  if (!res.ok) {
    throw new Error((data && (data.msg || data.message || data.error_description)) || "Erreur inconnue");
  }
  return data;
}

const auth = {
  signUp: (email, password) => supaFetch("/auth/v1/signup", { method: "POST", body: { email, password } }),
  signIn: (email, password) =>
    supaFetch("/auth/v1/token?grant_type=password", { method: "POST", body: { email, password } }),
};

function rest(table) {
  return {
    select: (query, token) => supaFetch(`/rest/v1/${table}?${query}`, { token }),
    insert: (row, token) => supaFetch(`/rest/v1/${table}`, { method: "POST", body: [row], token }),
    update: (query, patch, token) =>
      supaFetch(`/rest/v1/${table}?${query}`, { method: "PATCH", body: patch, token }),
  };
}
const profilesTable = rest("profiles");
const demandesTable = rest("demandes");

async function uploadDocument(userId, file, label, token) {
  const chemin = `${userId}/${label}-${Date.now()}-${file.name}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/documents/${chemin}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": file.type },
    body: file,
  });
  if (!res.ok) throw new Error("Échec de l'envoi du fichier");
  return chemin;
}

async function ouvrirDocument(chemin, token) {
  const res = await supaFetch(`/storage/v1/object/sign/documents/${chemin}`, {
    method: "POST",
    body: { expiresIn: 300 },
    token,
  });
  window.open(`${SUPABASE_URL}${res.signedURL}`, "_blank");
}

function App() {
  const [session, setSession] = useState(null);
  const [screen, setScreen] = useState("accueil");
  const [roleEnCours, setRoleEnCours] = useState(null);

  function retourAccueil() {
    setScreen("accueil");
    setRoleEnCours(null);
  }

  async function connecter(email, password, roleAttendu) {
    const res = await auth.signIn(email.trim().toLowerCase(), password);
    const token = res.access_token;
    const userId = res.user.id;
    const rows = await profilesTable.select(`id=eq.${userId}&select=*`, token);
    const profile = rows[0];
    if (!profile) throw new Error("Profil introuvable.");
    if (profile.supprime) throw new Error("Ce compte a été désactivé par l'administrateur.");
    if (roleAttendu && profile.role !== roleAttendu) throw new Error("Ce compte n'a pas ce rôle.");
    setSession({ token, userId, profile });
    retourAccueil();
  }

  function seDeconnecter() {
    setSession(null);
    retourAccueil();
  }

  function mettreAJourProfil(nouveauProfil) {
    setSession((s) => ({ ...s, profile: nouveauProfil }));
  }

  if (session?.profile.role === "admin") {
    return <Shell><TopBar label="Espace administrateur" onLogout={seDeconnecter} /><AdminDash session={session} /></Shell>;
  }
  if (session?.profile.role === "patient") {
    return <Shell><TopBar label={`Bonjour, ${session.profile.nom || ""}`} onLogout={seDeconnecter} /><PatientEspace session={session} /></Shell>;
  }
  if (session?.profile.role === "infirmier") {
    return <Shell><TopBar label={`Bonjour, ${session.profile.prenom || ""}`} onLogout={seDeconnecter} /><InfirmierEspace session={session} onProfilChange={mettreAJourProfil} /></Shell>;
  }

  return (
    <Shell>
      {screen === "accueil" && (
        <Accueil
          onChoisirRole={(role) => { setRoleEnCours(role); setScreen("auth"); }}
          onAdmin={() => { setRoleEnCours("admin"); setScreen("auth"); }}
        />
      )}
      {screen === "auth" && roleEnCours === "patient" && (
        <PatientAuth onRetour={retourAccueil} onConnecter={(e, p) => connecter(e, p, "patient")} />
      )}
      {screen === "auth" && roleEnCours === "infirmier" && (
        <InfirmierAuth onRetour={retourAccueil} onConnecter={(e, p) => connecter(e, p, "infirmier")} />
      )}
      {screen === "auth" && roleEnCours === "admin" && (
        <AdminAuth onRetour={retourAccueil} onConnecter={(e, p) => connecter(e, p, "admin")} />
      )}
      <p style={{ marginTop: 40, fontSize: 11, color: "#A69C8D", lineHeight: 1.6, textAlign: "center" }}>
        HomeCare — connecté à une base de données réelle (Supabase).
      </p>
    </Shell>
  );
}

    e.preventDefault();

function PatientAuth({ onRetour, onConnecter }) {
  const [mode, setMode] = useState("connexion");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [form, setForm] = useState({
    nom: "", telephone: "", quartier: "", sexe: "Femme", age: "", nationalite: "",
    situation_matrimoniale: "Célibataire", atcd_medicaux: "", atcd_chirurgicaux: "",
    atcd_familiaux: "", allergies: "", tuteur_nom: "", tuteur_telephone: "",
  });
  const [fichierPiece, setFichierPiece] = useState(null);
  const [erreur, setErreur] = useState("");
  const [chargement, setChargement] = useState(false);
  const [succes, setSucces] = useState(false);
  const c = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const mineur = form.age !== "" && Number(form.age) < 18;

  async function soumettre(e) {
    e.preventDefault();
    setErreur(""); setChargement(true);
    try {
      if (mode === "connexion") {
        await onConnecter(email, password);
      } else {
        if (!fichierPiece) throw new Error("Merci de joindre une photo de pièce d'identité.");
        if (mineur && (!form.tuteur_nom || !form.tuteur_telephone)) throw new Error("Un tuteur est requis pour les moins de 18 ans.");
        const res = await auth.signUp(email.trim().toLowerCase(), password);
        const token = res.access_token;
        if (!token) throw new Error("Confirmation e-mail encore activée côté Supabase — désactive-la.");
        const userId = res.user.id;
        const cheminPiece = await uploadDocument(userId, fichierPiece, "piece", token);
        await profilesTable.insert(
          {
            id: userId, role: "patient", email: email.trim().toLowerCase(), verified: false,
            nom: form.nom, telephone: form.telephone, quartier: form.quartier,
            sexe: form.sexe, age: Number(form.age), nationalite: form.nationalite,
            situation_matrimoniale: form.situation_matrimoniale,
            atcd_medicaux: form.atcd_medicaux, atcd_chirurgicaux: form.atcd_chirurgicaux,
            atcd_familiaux: form.atcd_familiaux, allergies: form.allergies,
            tuteur_nom: mineur ? form.tuteur_nom : null, tuteur_telephone: mineur ? form.tuteur_telephone : null,
            photo_piece_url: cheminPiece,
          },
          token
        );
        setSucces(true);
      }
    } catch (err) { setErreur(err.message); }
    finally { setChargement(false); }
  }

  if (succes) {
    return (
      <div style={{ textAlign: "center", padding: "20px 0" }}>
        <div style={{ fontSize: 28, color: T.primary }}>✓</div>
        <h2 style={{ ...titreStyle, textAlign: "center", marginTop: 12 }}>Compte créé</h2>
        <p style={{ fontSize: 14.5, color: "#4B5A4F", maxWidth: 360, margin: "0 auto 22px" }}>
          Ton compte est en attente de validation par l'administrateur.
        </p>
        <button onClick={onRetour} style={btnPrimary()}>Retour à l'accueil</button>
      </div>
    );
  }

  return (
    <div>
      <RetourLink onClick={onRetour} />
      <h2 style={titreStyle}>Espace patient</h2>
      <ModeToggle mode={mode} onChange={setMode} />
      <form onSubmit={soumettre}>
        <Champ label="E-mail"><input style={inputStyle} type="email" required value={email} onChange={(e) => setEmail(e.target.value)} /></Champ>

        {mode === "inscription" && (
          <>
            <Champ label="Nom complet"><input style={inputStyle} required value={form.nom} onChange={(e) => c("nom", e.target.value)} /></Champ>
            <Champ label="Téléphone"><input style={inputStyle} required value={form.telephone} onChange={(e) => c("telephone", e.target.value)} /></Champ>
            <Champ label="Quartier / résidence à Bamako"><input style={inputStyle} required value={form.quartier} onChange={(e) => c("quartier", e.target.value)} /></Champ>
            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <Champ label="Sexe">
                  <select style={inputStyle} value={form.sexe} onChange={(e) => c("sexe", e.target.value)}>
                    <option>Femme</option><option>Homme</option>
                  </select>
                </Champ>
              </div>
              <div style={{ flex: 1 }}>
                <Champ label="Âge"><input style={inputStyle} type="number" min="0" required value={form.age} onChange={(e) => c("age", e.target.value)} /></Champ>
              </div>
            </div>
            <Champ label="Nationalité"><input style={inputStyle} required value={form.nationalite} onChange={(e) => c("nationalite", e.target.value)} /></Champ>
            <Champ label="Situation matrimoniale">
              <select style={inputStyle} value={form.situation_matrimoniale} onChange={(e) => c("situation_matrimoniale", e.target.value)}>
                <option>Célibataire</option><option>Marié(e)</option><option>Divorcé(e)</option><option>Veuf(ve)</option>
              </select>
            </Champ>
            <FichierChamp label="Photo pièce d'identité (carte biométrique, fiche individuelle, CNI ou carte scolaire valide)" fichier={fichierPiece} onChange={setFichierPiece} />
            {mineur && (

                <Champ label="Téléphone du tuteur"><input style={inputStyle} required value={form.tuteur_telephone} onChange={(e) => c("tuteur_telephone", e.target.value)} /></Champ>

            <Champ label="Antécédents médicaux (maladies chroniques, autres)"><textarea style={{ ...inputStyle, minHeight: 60 }} value={form.atcd_medicaux} onChange={(e) => c("atcd_medicaux", e.target.value)} /></Champ>

function InfirmierAuth({ onRetour, onConnecter }) {
  const [mode, setMode] = useState("connexion");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [form, setForm] = useState({ nom: "", prenom: "", age: "", telephone: "", residence: "", specialite: "", diplomeReconnu: false });
  const [fichierCarte, setFichierCarte] = useState(null);
  const [fichierDiplome, setFichierDiplome] = useState(null);
  const [erreur, setErreur] = useState("");
  const [chargement, setChargement] = useState(false);
  const [succes, setSucces] = useState(false);
  const c = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  async function soumettre(e) {
    e.preventDefault();
    setErreur(""); setChargement(true);
    try {
      if (mode === "connexion") {
        await onConnecter(email, password);
      } else {
        if (!fichierCarte || !fichierDiplome) throw new Error("Merci de joindre les deux documents.");
        const res = await auth.signUp(email.trim().toLowerCase(), password);
        const token = res.access_token;
        if (!token) throw new Error("Confirmation e-mail encore activée côté Supabase — désactive-la.");
        const userId = res.user.id;
        const cheminCarte = await uploadDocument(userId, fichierCarte, "carte", token);
        const cheminDiplome = await uploadDocument(userId, fichierDiplome, "diplome", token);
        await profilesTable.insert(
          {
            id: userId, role: "infirmier", email: email.trim().toLowerCase(), verified: false,
            nom: form.nom, prenom: form.prenom, age: Number(form.age), telephone: form.telephone,
            residence: form.residence, specialite: form.specialite, diplome_reconnu: form.diplomeReconnu,
            photo_carte_url: cheminCarte, photo_diplome_url: cheminDiplome,
          },
          token
        );
        setSucces(true);
      }
    } catch (err) { setErreur(err.message); }
    finally { setChargement(false); }
  }

  if (succes) {
    return (
      <div style={{ textAlign: "center", padding: "20px 0" }}>
        <div style={{ fontSize: 28, color: T.primary }}>✓</div>
        <h2 style={{ ...titreStyle, textAlign: "center", marginTop: 12 }}>Compte créé</h2>
        <p style={{ fontSize: 14.5, color: "#4B5A4F", maxWidth: 360, margin: "0 auto 22px" }}>
          Ton compte et tes documents sont en attente de validation par l'administrateur.
        </p>
        <button onClick={onRetour} style={btnPrimary()}>Retour à l'accueil</button>
      </div>
    );
  }

  return (
    <div>
      <RetourLink onClick={onRetour} />
      <h2 style={titreStyle}>Espace infirmier</h2>
      <ModeToggle mode={mode} onChange={setMode} />
      <form onSubmit={soumettre}>
        <Champ label="E-mail"><input style={inputStyle} type="email" required value={email} onChange={(e) => setEmail(e.target.value)} /></Champ>
        <Champ label="Mot de passe"><input style={inputStyle} type="password" required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} /></Champ>
        {mode === "inscription" && (
          <>
            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1 }}><Champ label="Nom"><input style={inputStyle} required value={form.nom} onChange={(e) => c("nom", e.target.value)} /></Champ></div>
              <div style={{ flex: 1 }}><Champ label="Prénom"><input style={inputStyle} required value={form.prenom} onChange={(e) => c("prenom", e.target.value)} /></Champ></div>
            </div>
            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1 }}><Champ label="Âge"><input style={inputStyle} required type="number" min="18" value={form.age} onChange={(e) => c("age", e.target.value)} /></Champ></div>
              <div style={{ flex: 2 }}><Champ label="Téléphone"><input style={inputStyle} required value={form.telephone} onChange={(e) => c("telephone", e.target.value)} /></Champ></div>
            </div>
            <Champ label="Résidence"><input style={inputStyle} required value={form.residence} onChange={(e) => c("residence", e.target.value)} /></Champ>
            <Champ label="Spécialité / filière étudiée"><input style={inputStyle} required value={form.specialite} onChange={(e) => c("specialite", e.target.value)} /></Champ>
            <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18, fontSize: 14 }}>
              <input type="checkbox" required checked={form.diplomeReconnu} onChange={(e) => c("diplomeReconnu", e.target.checked)} />
              Je certifie que mon diplôme est reconnu par l'État
            </label>
            <FichierChamp label="Photo de la carte de l'ordre des infirmiers" fichier={fichierCarte} onChange={setFichierCarte} />
            <FichierChamp label="Photo du diplôme" fichier={fichierDiplome} onChange={setFichierDiplome} />
          </>
        )}
        <ErreurTexte>{erreur}</ErreurTexte>
        <button type="submit" disabled={chargement} style={btnPrimary({ marginTop: 4 })}>{chargement ? "Un instant…" : mode === "connexion" ? "Se connecter" : "Créer mon compte"}</button>
      </form>
    </div>
  );
}

function Ligne({ label, valeur, fort }) {

function LigneCopiable({ label, valeur }) {
  const [copie, setCopie] = useState(false);
  async function copier() {
    try {
      await navigator.clipboard.writeText(valeur.replace(/\s/g, ""));

      setTimeout(() => setCopie(false), 1800);

  }
  return (
    <button
      onClick={copier}
      style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: "none", border: "none", padding: "8px 0", cursor: "pointer", textAlign: "left" }}

      </div>

    try {
      await demandesTable.update(`id=eq.${id}`, { statut: "acceptee", infirmier_id: session.userId, infirmier_nom: `${session.profile.prenom} ${session.profile.nom}` }, session.token);
      charger();
    } catch (e) { setErreur(e.message); }
  }
  async function enregistrerConstantes(id, constantes) {
    try {
      await demandesTable.update(`id=eq.${id}`, constantes, session.token);
      charger();
    } catch (e) { setErreur(e.message); }
  }
  async function enregistrerDetails(id, details) {
    try {
      await demandesTable.update(`id=eq.${id}`, { details_soin: details }, session.token);
      charger();
    } catch (e) { setErreur(e.message); }
  }
  async function terminer(id, demande) {
    try {
      const penalite = !!session.profile.penalite_active;
      await demandesTable.update(`id=eq.${id}`, { statut: "terminee", penalite_appliquee: penalite }, session.token);
      if (penalite) {
        const nouveauProfil = { ...session.profile, penalite_active: false };
        await profilesTable.update(`id=eq.${session.userId}`, { penalite_active: false }, session.token);
        onProfilChange(nouveauProfil);
      }
      charger();
    } catch (e) { setErreur(e.message); }
  }
  async function annuler(id) {
    try {
      await demandesTable.update(`id=eq.${id}`, { statut: "annulee" }, session.token);
      await profilesTable.update(`id=eq.${session.userId}`, { penalite_active: true }, session.token);
      onProfilChange({ ...session.profile, penalite_active: true });
      charger();
    } catch (e) { setErreur(e.message); }
  }
  async function signaler(id, motif, details) {
    try {
      await demandesTable.update(`id=eq.${id}`, { signalement: true, signalement_motif: motif, signalement_details: details }, session.token);
      charger();
    } catch (e) { setErreur(e.message); }
  }

  const disponibles = demandes.filter((d) => d.statut === "attente");
  const mesInterventions = demandes.filter((d) => d.infirmier_id === session.userId);
  const gains = mesInterventions.filter((d) => d.statut === "terminee").reduce((s, d) => s + Math.round(d.tarif_soin * (1 - COMMISSION_TAUX) * (d.penalite_appliquee ? 0.5 : 1)) + d.deplacement, 0);

  return (
    <div>
      <div style={{ display: "flex", gap: 12, marginBottom: 12, fontSize: 13.5, color: T.muted }}>
        <span>{session.profile.specialite}</span><span>·</span><span>{session.profile.residence}</span>
      </div>
      {session.profile.penalite_active && (
        <div style={{ background: T.urgentBg || "#F6E5E2", color: T.urgent, borderRadius: 8, padding: "10px 14px", marginBottom: 14, fontSize: 13 }}>
          Pénalité en attente : votre prochain soin terminé sera payé à 50%, suite à une annulation.
        </div>
      )}
      <div style={{ background: T.primaryLight, borderRadius: 10, padding: "12px 16px", marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 13.5, color: "#4B5A4F" }}>Vos gains cumulés (soins terminés)</span>
        <strong style={{ fontSize: 16, color: T.primary }}>{formatFCFA(gains)}</strong>
      </div>
      <ErreurTexte>{erreur}</ErreurTexte>
      <Onglets items={[{ key: "disponibles", label: `Disponibles (${disponibles.length})` }, { key: "interventions", label: "Mes interventions" }]} actif={onglet} onChange={setOnglet} />
      {chargement ? <Spinner /> : onglet === "disponibles" ? (
        disponibles.length === 0 ? <VideMessage texte="Aucune demande disponible." /> :
        disponibles.map((d) => <DemandeRowInfirmier key={d.id} d={d} onAccepter={() => accepter(d.id)} />)
      ) : (
        mesInterventions.length === 0 ? <VideMessage texte="Aucune intervention." /> :
        mesInterventions.map((d) => (
          <DemandeRowInfirmier
            key={d.id} d={d} detaillee token={session.token} userId={session.userId}
            onEnregistrerConstantes={(c) => enregistrerConstantes(d.id, c)}
            onEnregistrerDetails={(det) => enregistrerDetails(d.id, det)}
            onTerminer={() => terminer(d.id, d)}
            onAnnuler={() => annuler(d.id)}
            onSignaler={(motif, details) => signaler(d.id, motif, details)}
          />
        ))
      )}
    </div>
  );
}

function DemandeRowInfirmier({ d, onAccepter, detaillee, onEnregistrerConstantes, onEnregistrerDetails, onTerminer, onAnnuler, onSignaler, token, userId }) {
  const s = STATUS[d.statut];
  const [constantes, setConstantes] = useState({
    constante_ta: d.constante_ta || "", constante_temp: d.constante_temp || "", constante_resp: d.constante_resp || "",
    constante_pouls: d.constante_pouls || "", constante_spo2: d.constante_spo2 || "", constante_conscience: d.constante_conscience || "",
  });
  const soinsListe = d.soin.split(",").map((x) => x.trim());
  const soinsAvecChamps = soinsListe.filter((s2) => SOIN_CHAMPS[s2]);
  const [detailsSoin, setDetailsSoin] = useState(() => {
    const base = {};
    soinsAvecChamps.forEach((s2) => { base[s2] = (d.details_soin && d.details_soin[s2]) || {}; });
    return base;
  });
  const [envoiPhoto, setEnvoiPhoto] = useState(false);
  const detailsDejaEnregistres = d.details_soin && Object.keys(d.details_soin).length > 0;
  function majDetail(soinNom, champKey, valeur) {
    setDetailsSoin((f) => ({ ...f, [soinNom]: { ...f[soinNom], [champKey]: valeur } }));
  }
  async function gererPhoto(soinNom, champKey, file) {
    if (!file) return;
    setEnvoiPhoto(true);
    try {
      const chemin = await uploadDocument(userId, file, `pansement-${d.id}`, token);
      majDetail(soinNom, champKey, chemin);
    } catch (e) {}
    finally { setEnvoiPhoto(false); }
  }
  const [afficherSignal, setAfficherSignal] = useState(false);
  const [motifs, setMotifs] = useState([]);
  const [details, setDetails] = useState("");
  const cc = (k, v) => setConstantes((f) => ({ ...f, [k]: v }));
  const constantesEnregistrees = !!d.constante_ta;
  const OPTIONS_SIGNALEMENT = ["Cas à référer (dépasse mes compétences)", "Patient/patiente coopérant(e)", "Effets secondaires", "Autres"];
  function basculerMotif(m) {
    setMotifs((ms) => (ms.includes(m) ? ms.filter((x) => x !== m) : [...ms, m]));
  }

  return (
    <div style={{ borderLeft: `3px solid ${d.urgent ? T.urgent : s.color}`, background: T.card, padding: "13px 16px", marginBottom: 10, borderRadius: "0 8px 8px 0" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <strong style={{ fontSize: 14.5 }}>{d.soin}</strong>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: s.color }}>{s.label}</span>
      </div>
      <div style={{ fontSize: 13, color: T.muted, marginTop: 4, display: "grid", gap: 2 }}>
        <span>🧑 {d.soigne_nom} {d.pour_autrui ? `(${d.soigne_lien}, ${d.soigne_age} ans)` : "(patient lui-même)"}</span>
        <span>📍 {d.patient_quartier}</span>
        <span>📞 {d.patient_telephone}</span>
        <span>🕒 {new Date(d.heure).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}</span>
        {d.notes && <span style={{ fontStyle: "italic" }}>{d.notes}</span>}
      </div>

      {detaillee && (d.soigne_atcd_medicaux || d.soigne_atcd_chirurgicaux || d.soigne_atcd_familiaux || d.soigne_allergies || d.soigne_tuteur_nom) && (
        <div style={{ marginTop: 10, background: T.bgAlt, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, display: "grid", gap: 3 }}>
          {d.soigne_atcd_medicaux && <span><strong>Médicaux :</strong> {d.soigne_atcd_medicaux}</span>}
          {d.soigne_atcd_chirurgicaux && <span><strong>Chirurgicaux :</strong> {d.soigne_atcd_chirurgicaux}</span>}
          {d.soigne_atcd_familiaux && <span><strong>Familiaux :</strong> {d.soigne_atcd_familiaux}</span>}
          {d.soigne_allergies && <span><strong>Allergies :</strong> {d.soigne_allergies}</span>}
          {d.soigne_tuteur_nom && <span><strong>Tuteur :</strong> {d.soigne_tuteur_nom} — {d.soigne_tuteur_telephone}</span>}
        </div>
      )}

      {!detaillee && onAccepter && <div style={{ marginTop: 10 }}><button style={btnGhost()} onClick={onAccepter}>Accepter</button></div>}

      {detaillee && d.statut === "acceptee" && (
        <div style={{ marginTop: 12, borderTop: `1px solid ${T.line}`, paddingTop: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Constantes du patient</div>
          {constantesEnregistrees ? (
            <div style={{ fontSize: 12.5, color: T.muted, display: "grid", gap: 2, marginBottom: 10 }}>
              <span>TA {d.constante_ta} · T° {d.constante_temp} · R {d.constante_resp} · Pls {d.constante_pouls} · SpO2 {d.constante_spo2}</span>
              <span>État de conscience : {d.constante_conscience}</span>
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
              <input style={inputStyle} placeholder="TA (ex. 12/8)" value={constantes.constante_ta} onChange={(e) => cc("constante_ta", e.target.value)} />
              <input style={inputStyle} placeholder="T° (°C)" value={constantes.constante_temp} onChange={(e) => cc("constante_temp", e.target.value)} />
              <input style={inputStyle} placeholder="R (resp/min)" value={constantes.constante_resp} onChange={(e) => cc("constante_resp", e.target.value)} />
              <input style={inputStyle} placeholder="Pls (bpm)" value={constantes.constante_pouls} onChange={(e) => cc("constante_pouls", e.target.value)} />
              <input style={inputStyle} placeholder="SpO2 (%)" value={constantes.constante_spo2} onChange={(e) => cc("constante_spo2", e.target.value)} />
              <input style={inputStyle} placeholder="État de conscience" value={constantes.constante_conscience} onChange={(e) => cc("constante_conscience", e.target.value)} />
            </div>
          )}
          {!constantesEnregistrees && (
            <button style={btnGhost()} onClick={() => onEnregistrerConstantes(constantes)}>Enregistrer les constantes</button>
          )}

          {soinsAvecChamps.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Détails du/des soin(s)</div>
              {soinsAvecChamps.map((soinNom) => (
                <div key={soinNom} style={{ border: `1px solid ${T.line}`, borderRadius: 8, padding: 12, marginBottom: 10 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.primary, marginBottom: 8 }}>{soinNom}</div>
                  {detailsDejaEnregistres ? (
                    <div style={{ fontSize: 12.5, color: T.muted, display: "grid", gap: 2 }}>
                      {SOIN_CHAMPS[soinNom].map((champ) => {
                        const val = (d.details_soin[soinNom] || {})[champ.key];
                        if (!val) return null;
                        if (champ.type === "photo") {
                          return <button key={champ.key} style={btnGhost(T.muted)} onClick={() => ouvrirDocument(val, token)}>Voir la photo du pansement</button>;
                        }
                        return <span key={champ.key}>{champ.label} : {val}</span>;
                      })}
                    </div>
                  ) : (
                    <div style={{ display: "grid", gap: 8 }}>
                      {SOIN_CHAMPS[soinNom].map((champ) => {
                        const valeur = (detailsSoin[soinNom] || {})[champ.key] || "";
                        if (champ.type === "select") {
                          return (
                            <select key={champ.key} style={inputStyle} value={valeur} onChange={(e) => majDetail(soinNom, champ.key, e.target.value)}>
                              <option value="">{champ.label}</option>
                              {champ.options.map((o) => <option key={o} value={o}>{o}</option>)}
                            </select>
                          );
                        }
                        if (champ.type === "textarea") {
                          return <textarea key={champ.key} style={{ ...inputStyle, minHeight: 55 }} placeholder={champ.label} value={valeur} onChange={(e) => majDetail(soinNom, champ.key, e.target.value)} />;
                        }
                        if (champ.type === "photo") {
                          return (
                            <label key={champ.key} style={{ display: "flex", alignItems: "center", gap: 10, border: `1px dashed ${T.line}`, borderRadius: 8, padding: "10px 12px", cursor: "pointer" }}>
                              <span>{valeur ? "📄" : "📎"}</span>
                              <span style={{ fontSize: 13, color: T.muted }}>{valeur ? "Photo ajoutée" : envoiPhoto ? "Envoi…" : champ.label}</span>
                              <input type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => gererPhoto(soinNom, champ.key, e.target.files[0])} />
                            </label>
                          );
                        }
                        return <input key={champ.key} style={inputStyle} type={champ.type} placeholder={champ.label} value={valeur} onChange={(e) => majDetail(soinNom, champ.key, e.target.value)} />;
                      })}
                    </div>
                  )}
                </div>
              ))}
              {!detailsDejaEnregistres && (
                <button style={btnGhost()} onClick={() => onEnregistrerDetails(detailsSoin)}>Enregistrer les détails du soin</button>
              )}
            </div>
          )}

          <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
            <button style={btnGhost(T.muted)} onClick={onTerminer}>Marquer terminée</button>
            <button style={btnGhost(T.urgent)} onClick={() => { if (window.confirm("Annuler ce soin ? Une pénalité de -50% s'appliquera à votre prochain soin.")) onAnnuler(); }}>Annuler</button>
            <button style={btnGhost(T.gold)} onClick={() => setAfficherSignal((v) => !v)}>Signaler</button>
          </div>
          <p style={{ fontSize: 11.5, color: T.urgent, marginTop: 8, marginBottom: 0 }}>
            ⚠ Si vous acceptez un soin puis l'annulez ou ne l'effectuez pas, une pénalité de -50% sera automatiquement déduite de votre prochain soin terminé.
          </p>

          {afficherSignal && (
            <div style={{ marginTop: 10, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12 }}>
              <span style={{ display: "block", fontSize: 13.5, color: "#54604F", marginBottom: 8 }}>Choses à signaler (une ou plusieurs)</span>
              <div style={{ display: "grid", gap: 8, marginBottom: 14 }}>
                {OPTIONS_SIGNALEMENT.map((m) => (
                  <label key={m} style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${motifs.includes(m) ? T.gold : T.line}`, borderRadius: 8, padding: "9px 12px", background: motifs.includes(m) ? T.goldBg : "#FFFEFC" }}>
                    <input type="checkbox" checked={motifs.includes(m)} onChange={() => basculerMotif(m)} />
                    <span style={{ fontSize: 13.5 }}>{m}</span>
                  </label>
                ))}
              </div>
              <Champ label="Détails"><textarea style={{ ...inputStyle, minHeight: 55 }} value={details} onChange={(e) => setDetails(e.target.value)} /></Champ>
              <button
                style={btnPrimary(motifs.length === 0 ? { opacity: 0.5, cursor: "not-allowed" } : {})}
                disabled={motifs.length === 0}
                onClick={() => { onSignaler(motifs.join(", "), details); setAfficherSignal(false); setMotifs([]); setDetails(""); }}
              >
                Envoyer le signalement à l'administrateur
              </button>
            </div>
          )}
        </div>
      )}

      {detaillee && d.signalement && (
        <div style={{ marginTop: 10, fontSize: 12, color: T.gold }}>⚠ Signalé à l'administrateur — {d.signalement_motif}</div>
      )}
      {detaillee && d.statut === "annulee" && (
        <div style={{ marginTop: 10, fontSize: 12, color: T.urgent }}>Soin annulé</div>
      )}
    </div>
  );
}

function AdminDash({ session }) {
  const [onglet, setOnglet] = useState("apercu");
  const [demandes, setDemandes] = useState([]);
  const [profils, setProfils] = useState([]);
  const [chargement, setChargement] = useState(true);
  const [erreur, setErreur] = useState("");

  async function charger() {
    setChargement(true);
    try {
      const [d, p] = await Promise.all([
        demandesTable.select("order=created_at.desc&select=*", session.token),
        profilesTable.select("select=*&order=created_at.desc", session.token),
      ]);
      setDemandes(d); setProfils(p);
    } catch (e) { setErreur(e.message); }
    finally { setChargement(false); }
  }
  useEffect(() => { charger(); }, []);

  async function approuver(id) {
    try {
      await profilesTable.update(`id=eq.${id}`, { verified: true }, session.token);
      charger();
    } catch (e) { setErreur(e.message); }
  }
  async function desactiver(id) {
    if (!window.confirm("Désactiver ce compte ? La personne ne pourra plus se connecter.")) return;
    try {
      await profilesTable.update(`id=eq.${id}`, { supprime: true }, session.token);
      charger();
    } catch (e) { setErreur(e.message); }
  }
  async function reactiver(id) {
    try {
      await profilesTable.update(`id=eq.${id}`, { supprime: false }, session.token);
      charger();
    } catch (e) { setErreur(e.message); }
  }

  const terminees = demandes.filter((d) => d.statut === "terminee");
  const revenuSoins = terminees.reduce((s, d) => s + d.tarif_soin, 0);
  const commission = Math.round(revenuSoins * COMMISSION_TAUX);
  const revenuDeplacements = demandes.reduce((s, d) => s + (d.deplacement || 0), 0);
  const enAttente = profils.filter((u) => !u.verified && !u.supprime);
  const signalements = demandes.filter((d) => d.signalement);
  const penalites = demandes.filter((d) => d.penalite_appliquee || d.statut === "annulee");

  if (chargement) return <Spinner />;

  return (
    <div>
      <ErreurTexte>{erreur}</ErreurTexte>
      <p style={{ fontSize: 11.5, color: T.muted, marginTop: -8, marginBottom: 16 }}>
        Aucune donnée n'est jamais supprimée ici — les comptes désactivés et l'historique complet restent consultables en permanence.
      </p>
      <Onglets
        items={[
          { key: "apercu", label: "Aperçu" },
          { key: "historique", label: "Historique" },
          { key: "validations", label: `Validations (${enAttente.length})` },
          { key: "comptes", label: "Comptes" },
          { key: "signalements", label: `Signalements (${signalements.length})` },
        ]}
        actif={onglet} onChange={setOnglet}
      />

      {onglet === "apercu" && (
        <div>
          <div style={{ border: `1px solid ${T.line}`, borderRadius: 10, overflow: "hidden", display: "grid", gridTemplateColumns: "1fr 1fr", marginBottom: 16 }}>
            {[["Demandes totales", demandes.length], ["Soins terminés", terminees.length], ["Commission (10%)", formatFCFA(commission)], ["Déplacements collectés", formatFCFA(revenuDeplacements)]].map(([label, val], i) => (
              <div key={label} style={{ padding: "16px 18px", borderRight: i % 2 === 0 ? `1px solid ${T.line}` : "none", borderBottom: i < 2 ? `1px solid ${T.line}` : "none" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: T.primary }}>{val}</div>
                <div style={{ fontSize: 12.5, color: T.muted, marginTop: 2 }}>{label}</div>
              </div>
            ))}
          </div>
          {penalites.length > 0 && (
            <div style={{ border: `1px solid ${T.line}`, borderRadius: 10, padding: "14px 16px" }}>
              <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8 }}>Pénalités relevées</div>
              {penalites.map((d) => (
                <div key={d.id} style={{ fontSize: 13, color: T.muted, marginBottom: 4 }}>
                  {d.infirmier_nom || "infirmier"} — {d.statut === "annulee" ? "a annulé un soin accepté" : "soin payé à 50% (pénalité appliquée)"} · {d.soin}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {onglet === "historique" && (
        demandes.length === 0 ? <VideMessage texte="Aucune demande enregistrée." /> :
        demandes.map((d) => (
          <div key={d.id} style={{ borderLeft: `3px solid ${STATUS[d.statut].color}`, background: T.card, padding: "13px 16px", marginBottom: 10, borderRadius: "0 8px 8px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <strong style={{ fontSize: 14.5 }}>{d.soin}</strong>
              <span style={{ fontSize: 12.5, fontWeight: 600, color: STATUS[d.statut].color }}>{STATUS[d.statut].label}</span>
            </div>
            <div style={{ fontSize: 13, color: T.muted, marginTop: 4 }}>
              Demandeur : {d.patient_nom} · Soigné(e) : {d.soigne_nom} ({d.soigne_lien}) · {d.infirmier_nom || "non assignée"} · {formatFCFA(d.total)}
              {d.statut === "terminee" && ` · commission ${formatFCFA(Math.round(d.tarif_soin * COMMISSION_TAUX))}`}
              {d.penalite_appliquee && " · pénalité -50% appliquée"}
            </div>
            {d.constante_ta && (
              <div style={{ fontSize: 12, color: T.muted, marginTop: 4 }}>
                Constantes : TA {d.constante_ta} · T° {d.constante_temp} · R {d.constante_resp} · Pls {d.constante_pouls} · SpO2 {d.constante_spo2} · Conscience : {d.constante_conscience}
              </div>
            )}
            {d.details_soin && Object.keys(d.details_soin).length > 0 && (
              <div style={{ fontSize: 12, color: T.muted, marginTop: 6, display: "grid", gap: 3 }}>
                {Object.entries(d.details_soin).map(([nomSoin, champs]) => (
                  <div key={nomSoin}>
                    <strong>{nomSoin} :</strong>{" "}
                    {(SOIN_CHAMPS[nomSoin] || []).map((champ) => {
                      const val = champs[champ.key];
                      if (!val) return null;
                      if (champ.type === "photo") {
                        return (
                          <button key={champ.key} style={{ ...btnGhost(T.muted), padding: "2px 8px", fontSize: 11.5, marginLeft: 4 }} onClick={() => ouvrirDocument(val, session.token)}>
                            photo
                          </button>
                        );
                      }
                      return <span key={champ.key}>{champ.label} : {val} · </span>;
                    })}
                  </div>
                ))}
              </div>
            )}
            {d.signalement && <div style={{ fontSize: 12, color: T.gold, marginTop: 4 }}>⚠ Signalé — {d.signalement_motif} : {d.signalement_details}</div>}
          </div>
        ))
      )}

      {onglet === "validations" && (
        enAttente.length === 0 ? <VideMessage texte="Aucune inscription en attente." /> :
        enAttente.map((u) => <FicheCompte key={u.id} u={u} session={session} onApprouver={() => approuver(u.id)} />)
      )}

      {onglet === "comptes" && (
        profils.length === 0 ? <VideMessage texte="Aucun compte." /> :
        profils.filter((u) => u.role !== "admin").map((u) => (
          <FicheCompte key={u.id} u={u} session={session} onDesactiver={() => desactiver(u.id)} onReactiver={() => reactiver(u.id)} />
        ))
      )}

      {onglet === "signalements" && (
        signalements.length === 0 ? <VideMessage texte="Aucun signalement." /> :
        signalements.map((d) => (
          <div key={d.id} style={{ border: `1px solid ${T.line}`, background: T.card, borderRadius: 10, padding: "14px 16px", marginBottom: 10 }}>
            <strong style={{ fontSize: 14.5 }}>{d.soin}</strong>
            <div style={{ fontSize: 13, color: T.muted, marginTop: 4 }}>Infirmier(ère) : {d.infirmier_nom} · Patient : {d.soigne_nom}</div>
            <div style={{ fontSize: 13, color: T.gold, marginTop: 6 }}>Motif : {d.signalement_motif}</div>
            {d.signalement_details && <div style={{ fontSize: 13, color: T.muted, marginTop: 2 }}>{d.signalement_details}</div>}
          </div>
        ))
      )}
    </div>
  );
}

function FicheCompte({ u, session, onApprouver, onDesactiver, onReactiver }) {
  return (
    <div style={{ border: `1px solid ${T.line}`, background: T.card, borderRadius: 10, padding: "14px 16px", marginBottom: 10, opacity: u.supprime ? 0.55 : 1 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <strong style={{ fontSize: 14.5 }}>{u.role === "infirmier" ? `${u.prenom} ${u.nom}` : u.nom}</strong>
          <div style={{ fontSize: 12.5, color: T.muted }}>
            {u.role === "infirmier" ? "Infirmier" : "Patient"} · {u.email}
            {u.supprime && " · désactivé"}
            {!u.verified && !u.supprime && " · en attente"}
          </div>
        </div>
      </div>

      {u.role === "infirmier" && (
        <div style={{ fontSize: 13, color: "#4B5A4F", marginTop: 8, display: "grid", gap: 2 }}>
          <span>{u.specialite} · {u.age} ans · {u.residence}</span>
          <span>{u.telephone}</span>
          <div style={{ display: "flex", gap: 10, marginTop: 6, flexWrap: "wrap" }}>
            <button style={btnGhost(T.muted)} onClick={() => ouvrirDocument(u.photo_carte_url, session.token)}>Voir la carte de l'ordre</button>
            <button style={btnGhost(T.muted)} onClick={() => ouvrirDocument(u.photo_diplome_url, session.token)}>Voir le diplôme</button>
          </div>
        </div>
      )}

      {u.role === "patient" && (
        <div style={{ fontSize: 13, color: "#4B5A4F", marginTop: 8, display: "grid", gap: 2 }}>
          <span>{u.sexe} · {u.age} ans · {u.nationalite} · {u.situation_matrimoniale}</span>
          <span>{u.telephone} · {u.quartier}</span>
          {u.tuteur_nom && <span>Tuteur : {u.tuteur_nom} — {u.tuteur_telephone}</span>}
          {u.atcd_medicaux && <span>Antécédents médicaux : {u.atcd_medicaux}</span>}
          {u.atcd_chirurgicaux && <span>Antécédents chirurgicaux : {u.atcd_chirurgicaux}</span>}
          {u.atcd_familiaux && <span>Antécédents familiaux : {u.atcd_familiaux}</span>}
          {u.allergies && <span>Allergies : {u.allergies}</span>}
          {u.photo_piece_url && (
            <div style={{ marginTop: 6 }}>
              <button style={btnGhost(T.muted)} onClick={() => ouvrirDocument(u.photo_piece_url, session.token)}>Voir la pièce d'identité</button>
            </div>
          )}
        </div>
      )}

      <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
        {onApprouver && <button style={{ ...btnGhost(T.primary) }} onClick={onApprouver}>✓ Approuver</button>}
        {onDesactiver && !u.supprime && <button style={btnGhost(T.urgent)} onClick={onDesactiver}>Désactiver le compte</button>}
        {onReactiver && u.supprime && <button style={btnGhost(T.primary)} onClick={onReactiver}>Réactiver le compte</button>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
